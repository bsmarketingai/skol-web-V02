<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Karta produktu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<article onMouseEnter="{{enter}}" onMouseLeave="{{leave}}" style="display: flex; flex-direction: column; width: 100%; height: 100%; box-sizing: border-box; padding: 12px; border: 1px solid {{line}}; border-radius: 4px; background: #FFFFFF; box-shadow: {{shadow}}; transition: box-shadow 0.2s, border-color 0.2s; font-family: 'Open Sans', 'Segoe UI', Arial, sans-serif; color: #2B3033">
  <a href="Detail.dc.html" style="position: relative; display: block; aspect-ratio: 1 / 1; margin-bottom: 12px; overflow: hidden; border-radius: 4px; background: #FFFFFF">
    <img src="{{img}}" alt="{{title}}" style="display: block; width: 100%; height: 100%; object-fit: contain; transform: scale({{zoom}}); transition: transform 0.3s ease">
    <sc-if value="{{akce}}" hint-placeholder-val="{{true}}"><span style="position: absolute; top: 0; left: 0; display: inline-flex; align-items: center; height: 24px; padding: 0 8px; border-radius: 3px; background: #FA8231; color: #2B3033; font-size: 12px; font-weight: 700">Akce</span></sc-if>
    <sc-if value="{{hasPct}}" hint-placeholder-val="{{true}}"><span style="position: absolute; top: 0; right: 0; display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 50%; background: #F7B731; color: #2B3033; font-size: 13px; font-weight: 700">{{pct}}</span></sc-if>
  </a>
  <a href="Detail.dc.html" style="color: {{nameColor}}; font-size: 15px; font-weight: 600; line-height: 1.35; text-decoration: {{nameLine}}; text-underline-offset: 3px; transition: color 0.15s; height: 2.7em; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2" title="{{title}}">{{title}}</a>
  <!-- Úvodní text z popisu: vždy výška 3 řádků (stejná výška karet, zarovnané ceny a tlačítka), delší text končí „…“ -->
  <p style="height: 4.35em; margin: 6px 0 0; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; line-clamp: 3; font-size: 13px; line-height: 1.45; color: #5A666C">{{desc}}</p>
  <span style="display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 13px; font-weight: 600; color: #007A1A"><span style="width: 8px; height: 8px; border-radius: 50%; background: currentColor"></span>Skladem</span>
  <div style="display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; margin-top: auto; padding-top: 10px; font-variant-numeric: tabular-nums">
    <span style="font-size: 18px; font-weight: 700; color: {{priceColor}}">{{price}}</span>
    <sc-if value="{{hasOld}}" hint-placeholder-val="{{true}}"><s style="font-size: 13px; color: #66737A">{{old}}</s></sc-if>
  </div>
  <a href="Detail.dc.html" onMouseEnter="{{ctaEnter}}" onMouseLeave="{{ctaLeave}}" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; margin-top: 12px; border-radius: 4px; background: {{ctaBg}}; color: #FFFFFF; font-size: 15px; font-weight: 600; text-decoration: none; transition: background-color 0.15s">{{cta}}</a>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"title":{"editor":null},"img":{"editor":null},"price":{"editor":null},"old":{"editor":null},"pct":{"editor":null},"akce":{"editor":null},"meta":{"editor":null},"desc":{"editor":null},"vars":{"editor":null},"$preview":{"width":280,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    /* Hover: celá karta (stín, zvětšení fotky, modrý podtržený název) a zvlášť tlačítko (tmavší pozadí, posun šipky) */
    const p = this.props;
    const s = this.state || {};
    const hover = !!s.hover;
    const cta = !!s.cta;
    const old = p.old ?? '2 600 Kč';
    return {
      title: p.title ?? 'SPINE RS ENERGY 258',
      img: p.img ?? '/_blob/b0be7b43ecd1a13649ccac122713bf8d',
      price: p.price ?? '2 290 Kč',
      old: old,
      hasOld: !!old,
      priceColor: old ? '#B40808' : '#2B3033',
      pct: p.pct ?? '−12 %',
      hasPct: !!(p.pct ?? '−12 %'),
      akce: p.akce ?? true,
      meta: p.meta ?? 'Boty na běžky · Kombi · NNN',
      desc: p.desc || p.meta || 'Sportovní kombi boty pro vázání NNN. Vhodné na klasiku i bruslení, pevná plastová pata a vyztužená manžeta se suchým zipem zajišťují výborný přenos síly na lyže.',
      cta: (p.vars ?? true) ? 'Varianty' : 'Detail',
      nameColor: hover ? '#0077B3' : '#2B3033',
      nameLine: hover ? 'underline' : 'none',
      line: hover ? '#C3CACE' : '#E1E5E7',
      shadow: hover ? '0 8px 24px rgba(20, 30, 35, 0.12)' : 'none',
      zoom: hover ? 1.04 : 1,
      ctaBg: cta ? '#0077B3' : '#2E4047',
      ctaShift: cta ? '3px' : '0',
      enter: () => this.setState({ hover: true }),
      leave: () => this.setState({ hover: false, cta: false }),
      ctaEnter: () => this.setState({ cta: true }),
      ctaLeave: () => this.setState({ cta: false })
    };
  }
}
</script>
</body>
</html>
